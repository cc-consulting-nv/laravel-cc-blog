name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Supply-chain guard: esbuild's postinstall is on the allowBuilds
      # allowlist (pnpm-workspace.yaml) because vite needs the platform
      # binary. Before we let it run, verify the pinned version + SHA in
      # the lockfile matches the value we explicitly approved in
      # .esbuild-pinned.txt. Any drift fails the build and forces a
      # conscious review of the new esbuild release.
      - name: Verify pinned esbuild build script
        run: |
          set -euo pipefail
          EXPECTED=$(cat .esbuild-pinned.txt | tr -d '[:space:]')
          ACTUAL_VERSION=$(awk '/^  esbuild@/{gsub(":",""); print $1; exit}' pnpm-lock.yaml)
          ACTUAL_HASH=$(awk '/^  esbuild@/{getline; match($0, /sha512-[A-Za-z0-9+/=]+/); print substr($0, RSTART, RLENGTH); exit}' pnpm-lock.yaml)
          ACTUAL="${ACTUAL_VERSION} ${ACTUAL_HASH}"
          NORMALIZED=$(echo "$ACTUAL" | tr -d '[:space:]')
          if [ "$NORMALIZED" != "$EXPECTED" ]; then
            echo "::error::esbuild lockfile pin drifted from .esbuild-pinned.txt"
            echo "Expected: $EXPECTED"
            echo "Actual:   $NORMALIZED"
            echo "If this is an intentional upgrade, audit the new release"
            echo "(check npm advisories, GitHub releases, run sandtrace on"
            echo "the tarball), then update .esbuild-pinned.txt in the same"
            echo "commit as the lockfile change."
            exit 1
          fi
          echo "esbuild pin verified: $NORMALIZED"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package assets
        run: pnpm build

      - name: Verify dist artifacts produced
        run: test -d dist && test -n "$(ls -A dist)"

  release:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref_name == 'main'

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package assets
        run: pnpm build

      - name: Determine next version
        id: version
        uses: actions/github-script@v8
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseType = process.env.RELEASE_TYPE ?? 'patch';
            const semverTagPattern = /^v(\d+)\.(\d+)\.(\d+)$/;

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });

            const semverTags = tags
              .map(({ name }) => {
                const match = name.match(semverTagPattern);
                if (! match) {
                  return null;
                }

                return {
                  name,
                  major: Number(match[1]),
                  minor: Number(match[2]),
                  patch: Number(match[3]),
                };
              })
              .filter(Boolean)
              .sort((a, b) => {
                if (a.major !== b.major) {
                  return b.major - a.major;
                }

                if (a.minor !== b.minor) {
                  return b.minor - a.minor;
                }

                return b.patch - a.patch;
              });

            const latest = semverTags[0] ?? { major: 0, minor: 0, patch: 0 };

            const currentSha = context.sha;
            const existingTag = tags
              .find((tag) => semverTagPattern.test(tag.name) && tag.commit.sha === currentSha)
              ?.name;

            if (existingTag) {
              core.info(`Current commit already has release tag ${existingTag}.`);
              core.setOutput('should_release', 'false');
              core.setOutput('tag_name', existingTag);
              return;
            }

            let { major, minor, patch } = latest;

            switch (releaseType) {
              case 'major':
                major += 1;
                minor = 0;
                patch = 0;
                break;
              case 'minor':
                minor += 1;
                patch = 0;
                break;
              default:
                patch += 1;
            }

            const tagName = `v${major}.${minor}.${patch}`;
            core.setOutput('should_release', 'true');
            core.setOutput('tag_name', tagName);
            core.setOutput('release_type', releaseType);
            core.info(`Publishing ${tagName} (${releaseType}).`);

      # dist/ is gitignored on main, but Composer git installs need it.
      # Make a release-only commit with built dist/ added, point the tag at
      # that commit, and push. Consumers checking out the tag get a tree
      # with dist/ included; main stays clean.
      - name: Tag release commit with built assets
        if: steps.version.outputs.should_release == 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "chore(release): build dist for ${TAG_NAME}"
          git tag -f "${TAG_NAME}"
          git push origin "${TAG_NAME}" --force

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          make_latest: true
