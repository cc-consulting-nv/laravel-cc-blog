name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # dist/ is committed (see SECURITY.md). CI never runs `pnpm install` or
      # `pnpm build` — that closes the supply-chain postinstall vector
      # (Shai-Hulud / Mini Shai-Hulud class of attack). Contributors who touch
      # resources/js/ rebuild locally and commit the dist/ change in the same PR.
      - name: Verify dist artifacts present
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::dist/ missing — rebuild locally with 'pnpm build' and commit"; exit 1; }
          test -n "$(ls -A dist)" || { echo "::error::dist/ empty"; exit 1; }
          test -f dist/blog-admin.js || { echo "::error::dist/blog-admin.js missing"; exit 1; }
          test -f dist/laravel-cc-blog.css || { echo "::error::dist/laravel-cc-blog.css missing"; exit 1; }
          echo "dist/ verified:"
          ls -la dist/

      # Drift guard: if resources/js/ changed in this push, dist/ must also
      # have changed. Catches commits that bumped JS source but forgot to rebuild.
      - name: Verify dist is in sync with resources/js
        run: |
          set -euo pipefail
          # Compare the most recent commit that touched resources/js/ vs the most
          # recent commit that touched dist/. dist/ should be at-or-after.
          JS_TS=$(git log -1 --format=%ct -- 'resources/js/' || echo 0)
          DIST_TS=$(git log -1 --format=%ct -- 'dist/' || echo 0)
          if [ "$JS_TS" -gt "$DIST_TS" ] 2>/dev/null; then
            echo "::error::resources/js/ was modified more recently than dist/."
            echo "Did you forget to run 'pnpm build' and commit dist/?"
            git log -1 --oneline -- 'resources/js/'
            git log -1 --oneline -- 'dist/'
            exit 1
          fi
          echo "dist/ is in sync with resources/js/"

  release:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref_name == 'main'

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Determine next version
        id: version
        uses: actions/github-script@v8
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseType = process.env.RELEASE_TYPE ?? 'patch';
            const semverTagPattern = /^v(\d+)\.(\d+)\.(\d+)$/;

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });

            const semverTags = tags
              .map(({ name }) => {
                const match = name.match(semverTagPattern);
                if (! match) {
                  return null;
                }

                return {
                  name,
                  major: Number(match[1]),
                  minor: Number(match[2]),
                  patch: Number(match[3]),
                };
              })
              .filter(Boolean)
              .sort((a, b) => {
                if (a.major !== b.major) {
                  return b.major - a.major;
                }

                if (a.minor !== b.minor) {
                  return b.minor - a.minor;
                }

                return b.patch - a.patch;
              });

            const latest = semverTags[0] ?? { major: 0, minor: 0, patch: 0 };

            const currentSha = context.sha;
            const existingTag = tags
              .find((tag) => semverTagPattern.test(tag.name) && tag.commit.sha === currentSha)
              ?.name;

            if (existingTag) {
              core.info(`Current commit already has release tag ${existingTag}.`);
              core.setOutput('should_release', 'false');
              core.setOutput('tag_name', existingTag);
              return;
            }

            let { major, minor, patch } = latest;

            switch (releaseType) {
              case 'major':
                major += 1;
                minor = 0;
                patch = 0;
                break;
              case 'minor':
                minor += 1;
                patch = 0;
                break;
              default:
                patch += 1;
            }

            const tagName = `v${major}.${minor}.${patch}`;
            core.setOutput('should_release', 'true');
            core.setOutput('tag_name', tagName);
            core.setOutput('release_type', releaseType);
            core.info(`Publishing ${tagName} (${releaseType}).`);

      # dist/ is committed on main now, so we can tag the current commit
      # directly instead of building a release-only commit with added assets.
      - name: Tag release
        if: steps.version.outputs.should_release == 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          make_latest: true
